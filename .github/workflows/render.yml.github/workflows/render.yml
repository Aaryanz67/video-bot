name: Render video

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "progress or newstart"
        required: true
      line1:
        description: "first line of the quote"
        required: true
      line2:
        description: "second line of the quote"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev pkg-config python3-dev
          pip install pycairo numpy

      - name: Install fonts
        run: |
          mkdir -p ~/.fonts
          cp *.ttf *.otf ~/.fonts/
          fc-cache -f

      - name: Draw the video
        run: |
          python render.py --theme "${{ inputs.theme }}" --line1 "${{ inputs.line1 }}" --line2 "${{ inputs.line2 }}" --out out/video.mp4

      - name: Save the video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
