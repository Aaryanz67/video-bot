name: Render video

on:
  workflow_dispatch:
    inputs:
      id:
        description: "unique id for this video"
        required: true
      theme:
        description: "progress or newstart"
        required: true
      line1:
        description: "first line of the quote"
        required: true
      line2:
        description: "second line of the quote"
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev pkg-config python3-dev
          pip install pycairo numpy

      - name: Install fonts
        run: |
          mkdir -p ~/.fonts
          cp *.ttf *.otf ~/.fonts/
          fc-cache -f

      - name: Draw the video
        env:
          THEME: ${{ inputs.theme }}
          L1: ${{ inputs.line1 }}
          L2: ${{ inputs.line2 }}
        run: python render.py --theme "$THEME" --line1 "$L1" --line2 "$L2" --out out/video.mp4

      - name: Publish the video
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "video-${{ inputs.id }}" out/video.mp4 --title "video-${{ inputs.id }}" --notes "daily video"
